        - paragraph [ref=e14]: 第一课 · 心智模型
        - heading "网关的本质与网络基础" [level=1] [ref=e15]
        - paragraph [ref=e16]: 先不背产品名。我们从“边界、代理、策略”三个词出发，把家庭路由器、Nginx、API Gateway 和 AI Gateway 放进同一个模型。
        - generic [ref=e17]:
          - generic [ref=e18]: 约 25 分钟
          - generic [ref=e19]: 15 个概念
          - generic [ref=e20]: 4 个练习
      - text: "1"
    - generic [ref=e21]:
      - generic [ref=e22]:
        - generic [ref=e23]: 01—A
        - generic [ref=e24]:
          - heading "一个能覆盖所有网关的定义" [level=2] [ref=e25]
          - paragraph [ref=e26]: 先抓住不随产品变化的本质，再理解不同形态。
      - generic [ref=e27]:
        - heading "本课总纲" [level=3] [ref=e28]
        - paragraph [ref=e29]: 网关是位于两个通信域边界上的中介节点。它代表一侧接收通信，按照统一策略决定拒绝、转换、路由或转发，再把通信交给另一侧。
      - generic [ref=e30]:
        - article [ref=e31]:
          - generic [ref=e32]: Concept 01
          - heading "通信域（Communication Domain）" [level=3] [ref=e33]
          - paragraph [ref=e34]: 一组遵守相近规则、能直接通信的参与者。公网与公司内网是两个通信域；用户应用与模型供应商也可以看成两个通信域。
          - generic [ref=e35]:
            - strong [ref=e36]: 通俗解释
            - text: 像两栋门禁规则不同的办公楼。楼内可以自由走动，跨楼则必须经过门口。
        - article [ref=e37]:
          - generic [ref=e38]: Concept 02
          - heading "边界（Boundary）" [level=3] [ref=e39]
          - paragraph [ref=e40]: 两个通信域相接的位置。边界意味着信任、协议、地址或管理责任发生变化。
          - generic [ref=e41]:
            - strong [ref=e42]: 案例
            - text: 浏览器属于不可信公网，订单服务属于私有网络；公网入口就是安全边界。
        - article [ref=e43]:
          - generic [ref=e44]: Concept 03
          - heading "代理（Proxy）" [level=3] [ref=e45]
          - paragraph [ref=e46]: 调用者不直接接触真实处理者，而由中间节点代表一方完成通信。网关通常具有代理性质。
          - generic [ref=e47]:
            - strong [ref=e48]: 通俗解释
            - text: 你不直接进入仓库取货，而是把取货单交给窗口，窗口人员替你到仓库办理。
        - article [ref=e49]:
          - generic [ref=e50]: Concept 04
          - heading "策略（Policy）" [level=3] [ref=e51]
          - paragraph [ref=e52]: 网关处理通信时执行的规则，例如谁能进、每分钟能进几次、请求应送到哪里。
          - generic [ref=e53]:
            - strong [ref=e54]: 案例
            - text: “普通用户每分钟最多调用聊天接口 20 次”就是一条网关策略。
        - article [ref=e55]:
          - generic [ref=e56]: Concept 05
          - heading "网关是一种角色，不是一种固定产品" [level=3] [ref=e57]
          - paragraph [ref=e58]: 路由器、Nginx、Envoy、Kong、AWS API Gateway 都可能扮演网关。判断依据不是软件名，而是它在当前架构中是否位于边界、代理通信并执行统一策略。
          - generic [ref=e59]:
            - strong [ref=e60]: 案例
            - text: 同一台 Nginx 在博客系统里可能只是静态 Web Server；在微服务前面接收全部 API 请求时，它就在扮演网关。
    - generic [ref=e61]:
      - generic [ref=e62]:
        - generic [ref=e63]: 01—B
        - generic [ref=e64]:
          - heading "描述流量时必须掌握的语言" [level=2] [ref=e65]
          - paragraph [ref=e66]: 这些词会贯穿后面四课。
      - generic [ref=e67]:
        - article [ref=e68]:
          - generic [ref=e69]: Concept 06
          - heading "下游（Downstream）与上游（Upstream）" [level=3] [ref=e70]
          - paragraph [ref=e71]: 连接到网关、发起请求的一侧叫下游；接收网关转发请求的一侧叫上游。它们是相对于当前代理而言的。
          - generic [ref=e72]:
            - strong [ref=e73]: 案例
            - text: 浏览器 → Nginx → FastAPI。对 Nginx 而言，浏览器是下游，FastAPI 是上游。
        - article [ref=e74]:
          - generic [ref=e75]: Concept 07
          - heading "入口（Ingress）与出口（Egress）" [level=3] [ref=e76]
          - paragraph [ref=e77]: Ingress 表示流量进入一个受管理区域；Egress 表示流量离开该区域。它们描述方向，不必然指某个产品。
          - generic [ref=e78]:
            - strong [ref=e79]: 案例
            - text: 用户访问集群是 Ingress；Agent 从集群调用外部搜索 API 是 Egress。
        - article [ref=e80]:
          - generic [ref=e81]: Concept 08
          - heading "数据包、连接与请求" [level=3] [ref=e82]
          - paragraph [ref=e83]: 数据包是网络层传输单元；TCP 连接是一段可靠通信通道；HTTP 请求是在连接上承载的应用消息。不同网关处理的对象不同。
          - generic [ref=e84]:
            - strong [ref=e85]: 通俗解释
            - text: 数据包像一辆辆货车，连接像固定运输线路，请求像一张完整订单。
        - article [ref=e86]:
          - generic [ref=e87]: Concept 09
          - heading "端点（Endpoint）" [level=3] [ref=e88]
          - paragraph [ref=e89]: 可以被访问的具体网络位置，通常由 IP、端口或 URL 表示。一个服务可能有多个实例，也就有多个端点。
          - generic [ref=e90]:
            - strong [ref=e91]: 案例
            - text: 订单服务有三个实例：
            - code [ref=e92]: 10.0.1.8:8000
            - text: 、
            - code [ref=e93]: 10.0.1.9:8000
            - text: 、
            - code [ref=e94]: 10.0.1.10:8000
            - text: 。
      - generic [ref=e95]: 下游客户端 网关 上游服务 Browser ── HTTP Request ──▶ Listener ── Route ──▶ Endpoint 进入（Ingress） 真实处理者
