[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sesame-voice-gateway"
version = "0.1.0"
description = "Computer-side voice gateway for Sesame Robot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dashscope>=1.25.17,<2",
  "fastapi>=0.116,<1",
  "jsonschema>=4.25,<5",
  "opuslib>=3.0,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyserial>=3.5,<4",
  "requests>=2.34,<3",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<16",
  "zeroconf>=0.147,<1",
]

[project.scripts]
sesame-voice-gateway = "sesame_voice_gateway.server_cli:main"
sesame-openclaw-sse-bridge = "sesame_voice_gateway.openclaw.sse_bridge:main"
sesame-enroll-voice = "sesame_voice_gateway.voice_enrollment_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["apps/voice_gateway/src/sesame_voice_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"../contracts/schemas" = "sesame_voice_gateway/_schemas"
"apps/voice_gateway/src/sesame_voice_gateway/dashboard.html" = "sesame_voice_gateway/dashboard.html"
"apps/voice_gateway/src/sesame_voice_gateway/console.html" = "sesame_voice_gateway/console.html"
"apps/voice_gateway/src/sesame_voice_gateway/test_console.html" = "sesame_voice_gateway/test_console.html"
