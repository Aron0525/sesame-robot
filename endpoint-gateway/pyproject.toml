[project]
name = "sesame-endpoint-gateway"
version = "0.1.0"
description = "Secure edge voice gateway for Sesame Robot V3"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1",
  "opuslib>=3,<4",
  "uvicorn[standard]>=0.29,<1",
  "zeroconf>=0.147,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
]

[tool.unittest]
start-directory = "tests"
