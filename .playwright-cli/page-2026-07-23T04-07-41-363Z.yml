      - generic [ref=e127]:
        - article [ref=e128]:
          - generic [ref=e129]: Concept 10
          - heading "网络层网关（L3 Gateway）" [level=3] [ref=e130]
          - paragraph [ref=e131]: 根据 IP 路由表决定数据包的下一跳，不理解订单、用户或 HTTP 路径。
          - generic [ref=e132]:
            - strong [ref=e133]: 案例
            - text: 电脑发现目标 IP 不在本地网段，于是把数据包发给默认网关
            - code [ref=e134]: 192.168.1.1
            - text: 。
        - article [ref=e135]:
          - generic [ref=e136]: Concept 11
          - heading "传输层网关或四层代理" [level=3] [ref=e137]
          - paragraph [ref=e138]: 根据 IP、端口和连接状态转发 TCP/UDP 流量，性能高，但通常不知道 HTTP 路径。
          - generic [ref=e139]:
            - strong [ref=e140]: 案例
            - text: 云负载均衡器把所有到 443 端口的 TCP 连接分给四台 Nginx。
        - article [ref=e141]:
          - generic [ref=e142]: Concept 12
          - heading "应用层网关（L7 Gateway）" [level=3] [ref=e143]
          - paragraph [ref=e144]: 理解 HTTP、gRPC、WebSocket 等应用协议，因此能依据路径、方法、Header、Cookie、用户身份和消息内容做决策。
          - generic [ref=e145]:
            - strong [ref=e146]: 案例
            - code [ref=e147]: GET /products
            - text: 可公开访问；
            - code [ref=e148]: POST /admin/products
            - text: 必须是管理员，并且每分钟最多 30 次。
    - generic [ref=e149]:
      - generic [ref=e150]:
        - generic [ref=e151]: 01—D
        - generic [ref=e152]:
          - heading "默认网关、路由器、NAT 与防火墙" [level=2] [ref=e153]
          - paragraph [ref=e154]: 这些词经常与“网关”一起出现，但并不等同。
      - generic [ref=e155]:
        - article [ref=e156]:
          - generic [ref=e157]: Concept 13
          - heading "默认网关（Default Gateway）" [level=3] [ref=e158]
          - paragraph [ref=e159]: 主机找不到更具体路由时，把数据包交给的默认下一跳。
          - generic [ref=e160]:
            - strong [ref=e161]: 通俗解释
            - text: 你不知道某个快递的专用通道时，就统一先交给小区大门的快递站。
        - article [ref=e162]:
          - generic [ref=e163]: Concept 14
          - heading "路由与下一跳（Route / Next Hop）" [level=3] [ref=e164]
          - paragraph [ref=e165]: 路由表把目标网段映射到下一跳或网络接口。网关通常根据路由表转发，但“路由器”强调转发网络包，“网关”强调跨边界角色。
          - generic [ref=e166]:
            - strong [ref=e167]: 案例
            - code [ref=e168]: 10.0.0.0/8
            - text: 走公司 VPN；其他目标走家庭默认网关。
        - article [ref=e169]:
          - generic [ref=e170]: Concept 15
          - heading "NAT（网络地址转换）" [level=3] [ref=e171]
          - paragraph [ref=e172]: 把内部私有地址转换成公网地址。家庭路由器常同时提供默认网关、NAT、防火墙和 Wi-Fi，所以这些概念容易被混为一谈。
          - generic [ref=e173]:
            - strong [ref=e174]: 案例
            - text: 家中三台设备使用不同私有 IP，却通过路由器的同一个公网 IP 访问互联网。
        - article [ref=e175]:
          - generic [ref=e176]: Adjacent Concept
          - heading "防火墙与 DNS 不是网关的同义词" [level=3] [ref=e177]
          - paragraph [ref=e178]: 防火墙的核心是允许或阻止流量；DNS 的核心是名称解析。它们可以与网关集成，但职责不同。
          - generic [ref=e179]:
            - strong [ref=e180]: 案例
            - text: DNS 把
            - code [ref=e181]: api.example.com
            - text: 解析到网关 IP；防火墙只允许 443；网关再把请求路由到订单服务。
